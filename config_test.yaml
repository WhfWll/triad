# 通用配置
scanUrl: http://192.168.3.3:8770/
scanIp: 192.168.0.68
timeout: 30
maxDepth: 3
concurrency: 1
userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
cookie: "PHPSESSID=c80e2202e861cb3db30b58367346d555; security_level=0"
proxy: ""
webHook:
crawlerMode: crawler
scanMode: single

# 日志配置
logConfig:
  enabled: true                    # 是否启用日志记录
  level: "info"                    # 日志级别: debug, info, warn, error
  format: "text"                   # 日志格式: text, json
  filePath: "logs/scanner.log"     # 日志文件路径，为空则只输出到控制台
  maxSize: 100                     # 日志文件最大大小(MB)
  maxBackups: 3                    # 保留的日志文件数量
  maxAge: 7                        # 日志文件保留天数
  compress: true                   # 是否压缩旧日志文件
  enableConsole: false              # 是否同时输出到控制台

# 脚本列表配置
scriptList:
#  - "mitm_source_leak_check"
#  - "mitm_xss_check"
#  - "mitm_sql_check"
#  - "mitm_ssrf_check"
#  - "mitm_xxe_check"
#  - "arbitrary_file_download"
  - "mitm_fileupload_check"
