#  - "mitm_crlf_injection_check"
#  - "weblogic_ssrf_check"
#  - "redis_unauthorized_access_check"
#  - "service_bruteforce_check"

# 原理验证脚本配置
principleVerifyScripts:
  enabled: true                                    # 是否启用原理验证脚本过滤
  scriptListFile: "scripts/principle_verify_scripts.txt"  # 外部脚本列表文件路径

# 模块特定配置
# 无头浏览器爬虫配置
crawlerx:
  exePath:
  wsAddress: ws://127.0.0.1:7317
  vue: false
  sensitiveWord: "logout,退出"
  localStorage:

portScan:
  scanPort: 33306
  protocol: tcp
  timeout: 10
  fingerprint:
    enabled: true
    rulesFile: "fingerprint-rules.yml"

# 子域名爆破配置
subdomainBrute:
  enabled: true                                    # 是否启用子域名爆破
  timeout: "5s"                                   # DNS查询超时时间
  concurrent: 20                                   # 并发数
  wordlistPath: "wordlists/subdomains.txt"        # 自定义字典文件路径
  customSubdomains:                                # 自定义子域名列表
    - "api"
    - "admin"
    - "test"
    - "dev"
  useBuiltinDict: true                             # 是否使用内置字典
  maxDepth: 2                                      # 最大递归深度
  filterWildcard: true                             # 是否过滤通配符解析
  dnsServers:                                      # 自定义DNS服务器列表
    - "8.8.8.8"
    - "114.114.114.114"
    - "1.1.1.1"
  retryCount: 3                                    # 重试次数
  delayBetween: 50                                 # 请求间隔（毫秒）

testMode:
  principleVerify: true
  versionMatch: true

# 后渗透配置
postExploit:
  enabled: true                                    # 是否启用后渗透功能
  reverseShell:
    listenerHost: "192.168.1.100"                   # 监听主机地址
    listenerPort: "4444"                              # 监听端口
    shellType: "bash"                               # shell类型: bash, powershell, cmd, python
    timeout: 30                                     # 连接超时时间(秒)
  webshell:
    uploadPath: "/tmp/"                             # webshell上传路径
    shellFile: "shell.php"                          # webshell文件名
    password: "rebeyond"                                # webshell密码
    customShells:                                   # 自定义webshell文件路径
      - "D:\\goproject\\webScanner\\payloads\\shells\\php_shell.php"
      - "D:\\goproject\\webScanner\\payloads\\shells\\jsp_shell.jsp"
      - "D:\\goproject\\webScanner\\payloads\\shells\\aspx_shell.aspx"
  sshKey:
    publicKey: "ssh-rsa  whf@Win102021GW"
  persistence:
    enabled: false                                  # 是否启用持久化
    methods:                                        # 持久化方法
      - "crontab"                                   # Linux定时任务
      - "registry"                                  # Windows注册表
      - "service"                                   # 系统服务
    backupShells: 3                                 # 备份shell数量
  privilege:
    enabled: false                                  # 是否启用提权
    autoPrivesc: false                              # 是否自动提权
    methods:                                        # 提权方法
      - "kernel_exploit"                            # 内核漏洞利用
      - "suid_binary"                               # SUID二进制文件
      - "sudo_exploit"                              # sudo漏洞利用
      - "service_exploit"                           # 服务漏洞利用
  lateral:
    enabled: false                                  # 是否启用横向移动
    scanInternalNetwork: false                      # 是否扫描内网
    credentialHarvesting: false                     # 是否收集凭据
    networkRange: "192.168.1.0/24"                 # 内网扫描范围
  exfiltration:
    enabled: false                                  # 是否启用数据外带
    methods:                                        # 外带方法
      - "http"                                      # HTTP外带
      - "dns"                                       # DNS外带
      - "ftp"                                       # FTP外带
    exfilServer: "http://192.168.1.100:8080"        # 外带服务器地址
    maxFileSize: 10485760                          # 最大文件大小(字节)
    targetFiles:                                    # 目标文件类型
      - "*.txt"
      - "*.doc"
      - "*.pdf"
      - "*.sql"
      - "*.config"
  cleanup:
    enabled: true                                   # 是否启用清理功能
    autoCleanup: false                              # 是否自动清理
    cleanupDelay: 300                               # 清理延迟时间(秒)
    removeUploaded: true                            # 是否删除上传的文件
    clearLogs: false                                # 是否清理日志

serviceBrute:
  enabled: true
  timeout: 300
  targetsConcurrent: 5
  tasksConcurrent: 3
  userDictPath: "/path/to/usernames.txt"
  passDictPath: "/path/to/passwords.txt"
  enabledServices: ["ssh", "ftp", "mysql", "redis"]
  skipServices: ["rdp"]
  serviceConfigs:
    ssh:
      enabled: true
      timeout: 300
      usernames: ["root", "admin"]
      passwords: ["root", "password"]
